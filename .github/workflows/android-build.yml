name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: Run Android instrumentation tests on a disposable emulator
        required: false
        default: false
        type: boolean
      run_managed_instrumentation:
        description: Run Android instrumentation tests on the Gradle Managed Device
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up bundletool
        run: |
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/bundletool-all-1.18.3.jar" \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate localization resources
        run: python3 tools/validate_localization.py

      - name: Verify security configuration
        run: python3 tools/verify_security_configuration.py

      - name: Verify reliability configuration
        run: python3 tools/verify_reliability_configuration.py

      - name: Verify performance and resource configuration
        run: python3 tools/verify_performance_configuration.py

      - name: Verify Compose UI quality
        run: python3 tools/verify_ui_quality.py

      - name: Build and test all release variants
        run: ./gradlew clean testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify release artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify production release readiness
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
        run: python3 tools/verify_release_readiness.py

      - name: Verify AAB 16 KB page alignment
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
        run: python3 tools/verify_aab_16kb.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-release-unsigned-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-release-unsigned-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-android-test-apk-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-unit-test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Emulator instrumentation tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumentation == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and API 35 system image
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-35 system-images;android-35;google_apis;x86_64'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run instrumentation tests on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: sleep 20 && adb devices && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload emulator instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-emulator-instrumentation-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  managed-instrumentation:
    name: Gradle Managed Device instrumentation tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_managed_instrumentation == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for the managed device
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-35 system-images;android-35;default;x86_64'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run instrumentation tests on the Gradle Managed Device
        run: ./gradlew pixel2api35DebugAndroidTest --no-daemon --stacktrace

      - name: Upload managed-device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-managed-device-results-${{ github.sha }}
          path: |
            app/build/reports/androidTests/managed_device*/
            app/build/outputs/androidTest-results/managed_device*/
          if-no-files-found: warn
          retention-days: 14
